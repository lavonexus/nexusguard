# Render Blueprint - "New +" > "Blueprint" > pick this repo, Render reads this file and
# creates the database and both services in one go. Values marked "sync: false" are secrets
# that are never committed here - Render prompts for them once, in its own dashboard, at
# deploy time.
databases:
  - name: nexusguard-db
    databaseName: nexusguard
    user: nexusguard
    plan: free

services:
  - type: web
    name: nexusguard-api
    runtime: docker
    dockerfilePath: ./apps/api/NexusGuard.Api/Dockerfile
    dockerContext: ./apps/api/NexusGuard.Api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # The real fix for the inotify-limit crash: this switches .NET's file watcher to a
      # polling implementation that never touches the inotify API at all, instead of trying to
      # avoid triggering the limit. Needed because the crash happens inside
      # WebApplication.CreateBuilder() itself, before any of our own code runs, so nothing in
      # Program.cs can intervene early enough - confirmed by two failed deploys where a
      # Program.cs-level fix alone didn't help. https://github.com/dotnet/aspnetcore/issues/3475
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusguard-db
          property: connectionString
      # Custom domain (nexusscanner.com via GoDaddy, pointed at Render) - the onrender.com
      # URLs still work underneath but are no longer what the browser actually shows.
      - key: Cors__AllowedOrigins__0
        value: https://nexusscanner.com
      - key: Cors__AllowedOrigins__1
        value: https://www.nexusscanner.com
      - key: Dashboard__BaseUrl
        value: https://nexusscanner.com
      - key: Discord__RedirectUri
        value: https://api.nexusscanner.com/api/auth/discord/callback
      - key: Google__RedirectUri
        value: https://api.nexusscanner.com/api/auth/google/callback
      - key: Admin__BootstrapEmail
        sync: false
      - key: Discord__ClientId
        sync: false
      - key: Discord__ClientSecret
        sync: false
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: Anthropic__ApiKey
        sync: false
      # Must be the same literal value entered here and on nexusguard-bot's Discord__BotSharedSecret -
      # authenticates the bot's own endpoints (api/discord/*) instead of a per-server API key.
      - key: Discord__BotSharedSecret
        sync: false
      # Authenticates the user's separate ticket bot (C:\Users\PC\Desktop\nexus-ticketbot, not
      # part of this repo) against api/discord/tickets/* - a distinct secret from the scan-bot's
      # own, entered into that bot's own config.json, never committed here.
      - key: Discord__TicketBotSharedSecret
        sync: false
      # Free key from steamcommunity.com/dev/apikey - used to resolve a SteamID64 the scanner
      # already read from the local Steam client's own registry key into a public display name/
      # avatar. Optional: if unset, Steam identity is simply never attached to a scan.
      - key: Steam__ApiKey
        sync: false

  # Render's free plan doesn't offer Background Worker (confirmed on an actual deploy attempt -
  # "service type is not available for this plan") - "web" is the free-tier workaround: the bot
  # runs a bare HttpListener (see Program.cs's StartHealthCheckListener) purely so Render sees
  # HTTP traffic and treats this as a web service. A real Background Worker plan would be the
  # more reliable fix later, since a free web service still spins down after ~15 min idle,
  # taking the Discord connection down with it.
  - type: web
    name: nexusguard-bot
    runtime: docker
    dockerfilePath: ./apps/bot/NexusGuard.Bot/Dockerfile
    dockerContext: ./apps/bot/NexusGuard.Bot
    plan: free
    envVars:
      - key: Api__BaseUrl
        value: https://api.nexusscanner.com
      - key: Discord__BotToken
        sync: false
      - key: Discord__BotSharedSecret
        sync: false

  - type: web
    name: nexusguard-web
    runtime: docker
    dockerfilePath: ./apps/web/nexusguard-dashboard/Dockerfile
    dockerContext: ./apps/web/nexusguard-dashboard
    plan: free
    envVars:
      # Baked into the client bundle at build time - Render forwards service env vars to the
      # Docker build as --build-arg automatically, which is what the Dockerfile's
      # `ARG NEXT_PUBLIC_API_URL` picks up.
      - key: NEXT_PUBLIC_API_URL
        value: https://api.nexusscanner.com
